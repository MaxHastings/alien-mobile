name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S mobile -B mobile/build-release -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build mobile/build-release -j2
      - name: Test
        run: ctest --test-dir mobile/build-release --output-on-failure -j2
